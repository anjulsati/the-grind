<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Grind — DSA till mastery</title>
<meta name="description" content="A personal 23-week DSA plan by Anjul Sati, from the first study day to April 2027.">
<meta name="author" content="Anjul Sati">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0a0e14">
<link rel="stylesheet" href="src/styles/theme.css?v=85">
<link rel="stylesheet" href="src/styles/layout.css?v=85">
<link rel="stylesheet" href="src/styles/components.css?v=85">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <strong>The Grind</strong>
    <span class="sub">DSA only · 23 weeks</span>
  </div>
  <div class="todaybox">
    <div class="tb-line"><span id="todayLabel">—</span></div>
    <div class="bar"><div id="overallbar"></div></div>
    <div class="tb-line tiny"><span id="overallcount">0 / 0 DSA</span></div>
  </div>
  <div class="actions">
    <button id="jumpToday" class="btn">Jump to today</button>
    <div class="seg">
      <button id="noteBtn" class="btn" title="Sticky notes (N)">Note</button>
      <button id="penToggle" class="btn" title="Pen mode (P)">Pen</button>
    </div>
    <span id="syncSlot" class="sync-slot"></span>
  </div>
</header>

<input type="file" id="importFile" accept="application/json" style="display:none">

<div class="navwrap">
  <nav id="navchips" class="navchips"></nav>
</div>

<main id="app"></main>

<button id="topBtn" class="btn fab" title="Back to top">↑</button>

<canvas id="penCanvas"></canvas>
<div class="penbar" id="penbar">
  <span class="penlbl">Pen</span>
  <div class="swatches">
    <button class="sw on" data-color="#1E56C8" style="background:#1E56C8"></button>
    <button class="sw" data-color="#E4572E" style="background:#E4572E"></button>
    <button class="sw" data-color="#2E7D4F" style="background:#2E7D4F"></button>
    <button class="sw" data-color="#1B2530" style="background:#1B2530"></button>
    <button class="sw" data-color="#9A6B00" style="background:#9A6B00"></button>
  </div>
  <select id="penSize">
    <option value="2">thin</option><option value="4" selected>medium</option>
    <option value="8">thick</option><option value="14">marker</option>
  </select>
  <select id="penFade">
    <option value="10">fade 10s</option><option value="30" selected>fade 30s</option>
    <option value="60">fade 60s</option><option value="0">keep forever</option>
  </select>
  <button id="penClear" class="btn">Clear</button>
  <button id="penExit" class="btn solid">Done</button>
</div>

<div class="modal-wrap" id="modal"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="src/js/firebase-config.js?v=85"></script>
<script src="src/js/data.js?v=85"></script>
<script src="src/js/store.js?v=85"></script>
<script src="src/js/ui.js?v=85"></script>
<script src="src/js/editor.js?v=85"></script>
<script src="src/js/pen.js?v=85"></script>
<script src="src/js/events.js?v=85"></script>
<script src="src/js/cursor.js?v=85"></script>
<script src="src/js/notes.js?v=85"></script>
<script src="src/js/sync.js?v=85"></script>
<script src="src/js/main.js?v=85"></script>
</body>
</html>
