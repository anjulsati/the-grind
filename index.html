<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Grind — DSA till mastery</title>
<meta name="description" content="A personal 22-week plan by Anjul Sati: DSA, CS Fundamentals, and the FAANG bar.">
<meta name="author" content="Anjul Sati">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#F3F5F1">
<link rel="stylesheet" href="src/styles/theme.css?v=54">
<link rel="stylesheet" href="src/styles/layout.css?v=54">
<link rel="stylesheet" href="src/styles/components.css?v=54">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <strong>The Grind</strong>
    <span class="sub">DSA only — till FAANG/MAANG level<br>19 weeks · built with ❤ by Anjul Sati</span>
  </div>
  <div class="todaybox">
    <div class="tb-line"><span id="todayLabel">—</span></div>
    <div class="bar"><div id="overallbar"></div></div>
    <div class="tb-line tiny"><span id="overallcount">0 / 0</span><span class="sep">·</span><span id="countdown">—</span></div>
  </div>
  <div class="actions">
    <button id="jumpToday" class="btn">Jump to today</button>
    <button id="penToggle" class="btn" title="Pen mode (P)">✎ Pen</button>
    <button id="noteBtn" class="btn" title="Sticky notes (N)">💬 Note</button>
    <button id="editBtn" class="btn" title="Edit the plan (E)">Edit plan</button>
  </div>
</header>

<div class="editbar" id="editbar" style="display:none">
  <span class="eb-tag">EDIT MODE</span>
  <span class="eb-msg">Every change saves to this browser instantly.</span>
  <span class="eb-actions">
    <button id="restoreBtn" class="btn">Restore original</button>
    <button id="exportBtn" class="btn">Export plan</button>
    <button id="importBtn" class="btn">Import plan</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </span>
</div>

<div class="navwrap">
  <nav id="navchips" class="navchips"></nav>
</div>

<main id="app"></main>

<button id="topBtn" class="btn fab" title="Back to top">↑</button>

<canvas id="penCanvas"></canvas>
<div class="penbar" id="penbar">
  <span class="penlbl">Pen</span>
  <div class="swatches">
    <button class="sw on" data-color="#1E56C8" style="background:#1E56C8"></button>
    <button class="sw" data-color="#E4572E" style="background:#E4572E"></button>
    <button class="sw" data-color="#2E7D4F" style="background:#2E7D4F"></button>
    <button class="sw" data-color="#1B2530" style="background:#1B2530"></button>
    <button class="sw" data-color="#9A6B00" style="background:#9A6B00"></button>
  </div>
  <select id="penSize">
    <option value="2">thin</option><option value="4" selected>medium</option>
    <option value="8">thick</option><option value="14">marker</option>
  </select>
  <select id="penFade">
    <option value="10">fade 10s</option><option value="30" selected>fade 30s</option>
    <option value="60">fade 60s</option><option value="0">keep forever</option>
  </select>
  <button id="penClear" class="btn">Clear</button>
  <button id="penExit" class="btn solid">Done</button>
</div>

<div class="modal-wrap" id="modal"></div>
<div class="toast" id="toast"></div>

<script src="src/js/data.js?v=54"></script>
<script src="src/js/store.js?v=54"></script>
<script src="src/js/ui.js?v=54"></script>
<script src="src/js/editor.js?v=54"></script>
<script src="src/js/pen.js?v=54"></script>
<script src="src/js/events.js?v=54"></script>
<script src="src/js/cursor.js?v=54"></script>
<script src="src/js/notes.js?v=54"></script>
<script src="src/js/main.js?v=54"></script>
</body>
</html>
